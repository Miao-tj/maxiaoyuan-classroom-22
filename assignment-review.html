<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>作业评阅 · 马小原</title>
    <link rel="icon" href="./assets/mark.svg" />
    <link rel="stylesheet" href="./studio.css" />
    <link rel="stylesheet" href="./assignment-review.css" />
    <link rel="stylesheet" href="./live.css" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="./"
        ><span class="book"></span><span><b>马小原</b><small>课程学习工作台</small></span></a
      ><span class="course">马克思主义基本原理</span><i class="spacer"></i
      ><a class="btn" href="./">返回课程 ›</a>
    </header>
    <main class="review-page">
      <div class="crumb">课程工作台　/　作业评阅</div>
      <h1>作业评阅</h1>
      <section class="intake" id="dropzone">
        <div class="file-icon" aria-hidden="true">W</div>
        <div class="file-info">
          <h2 id="filename">选择作业</h2>
          <p>拖入 Word 文档，或在下方粘贴正文。</p>
        </div>
        <button class="outline" id="choose">选择 Word</button
        ><input type="file" id="upload" accept=".docx" hidden />
      </section>
      <form id="review-form" class="card segment">
        <label class="field"
          >待评正文<textarea
            id="essay"
            class="doc-preview"
            placeholder="可先删去姓名、学号等信息。仅发送此框中的文字。"
            required
            minlength="40"
            maxlength="9000"
          ></textarea></label
        ><label class="field"
          >评阅方式<select id="method">
            <option value="model">大模型评阅</option>
            <option value="device">通义千问 · 设备模型（首次约 429 MB）</option>
            <option value="rubric">课程量规初评（本设备）</option>
          </select></label
        >
        <p class="privacy-note" id="provider">评阅时会将正文发送至云端模型。</p>
        <button class="primary" id="submit">提交正文并评阅</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <article id="report" hidden>
        <header class="report-head">
          <div>
            <span class="tag">课程作业</span>
            <h2>评阅报告</h2>
          </div>
          <div class="grade" hidden>
            <small>综合得分</small>
            <div><strong id="total"></strong><span> / 100</span></div>
          </div>
        </header>
        <section class="reading-strip">
          <span class="review-figure" aria-hidden="true"
            ><img src="./assets/companion-awake.webp" alt="" /><img
              class="blink-face"
              src="./assets/companion-blink.webp"
              alt=""
          /></span>
          <div>
            <strong id="reading-label">正在阅读正文</strong>
            <div class="reading-track"><i></i><i></i><i></i><i></i></div>
          </div>
        </section>
        <h2 class="section-title">分项评价</h2>
        <div id="dimensions" class="dimensions" aria-live="polite"></div>
        <section class="review-summary" hidden>
          <h3>马小原总评</h3>
          <p></p>
        </section>
      </article>
    </main>
    <script type="module" src="./review.js?v=22r3"></script>
  </body>
</html>
